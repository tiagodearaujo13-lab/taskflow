<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="scss/main.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">TF</div>
          <h1>TaskFlow</h1>
        </div>
        <nav></nav>
      </aside>
      <main class="board-view">
        <header class="top-bar">
          <div class="sprint-info">
            <h2>Sprint</h2>
            <span class="badge warning">● days left</span>
          </div>
        </header>
        <div class="kanban-board" id="board">
          <div class="column">
            <div class="column-header border-yellow">
              <span>TO DO</span>
              <span class="count">5</span>
            </div>
            <div class="task-list" id="todo-list">
              <article class="task-card bg-yellow">
                <div class="card-header">
                  <span class="tag">Design</span>
                  <button class="btn-more">•••</button>
                </div>

                <div class="card-body">
                  <h4>Homepage Redesign</h4>
                  <p>
                    Create new high-fidelity mockups for the landing page based
                    on the brutalist moodboard.
                  </p>
                </div>

                <div class="card-footer">
                  <div class="avatar" style="background-color: #ff99cc"></div>

                  <div class="meta-info">
                    <span>📎 2</span>
                  </div>
                </div>
              </article>

              <article class="task-card">
                <div class="card-header">
                  <span class="tag">Research</span>
                  <button class="btn-more">•••</button>
                </div>

                <div class="card-body">
                  <h4>Competitor Analysis</h4>
                  <p>Analyze market trends and competitor strategies.</p>
                </div>

                <div class="card-footer">
                  <div class="avatar" style="background-color: #99ccff"></div>
                  <div class="meta-info">
                    <span>No Due Date</span>
                  </div>
                </div>
              </article>
            </div>
          </div>
          <div class="column">
            <div class="column-header border-pink">
              <span>IN PROGRESS</span>
              <span class="count">3</span>
            </div>
            <div class="task-list" id="inprogress-list"></div>
          </div>
          <div class="column">
            <div class="column-header border-blue">
              <span>DONE</span>
              <span class="count">0</span>
            </div>
            <div class="task-list" id="done-list"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
